name: Publish macOS release

on:
  push:
    branches:
      - main
    paths:
      - latest.json
      - appcast.xml
      - RELEASE_NOTES.md
      - release-assets/payroll-calculator.dmg
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove published releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            while read -r PUBLISHED_TAG; do
              gh release delete "$PUBLISHED_TAG" --cleanup-tag --yes
            done

      - name: Publish current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' latest.json)"
          TAG_NAME="v$VERSION"
          gh release create "$TAG_NAME" \
            "release-assets/payroll-calculator.dmg#payroll-calculator.dmg" \
            --target "$GITHUB_SHA" \
            --title "월급계산기 $TAG_NAME" \
            --notes-file RELEASE_NOTES.md
